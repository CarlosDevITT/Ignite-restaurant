<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1712">
  <meta name="description" content="Cardápio digital do Ignite Restaurante Pub. Escolha seus pratos e acompanhe seu pedido.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/supabase-config.js?v=status-final-20260906" defer></script>
  <link href="assets/uicons/css/uicons-regular-rounded.css?v=4" rel="stylesheet">
  <link rel="stylesheet" href="styles/cardapio.css?v=10">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
  <title>Cardápio | Ignite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#app-content">Ir para o conteúdo</a>

  <aside class="desktop-sidebar" aria-label="Navegação principal">
    <a class="brand" href="../index.html" aria-label="Voltar ao site Ignite">
      <span class="brand__mark"><img src="../../assets/images/logos/ignite2.png" alt=""></span>
      <span><strong>Ignite<span>.</span></strong><small>Restaurante Pub</small></span>
    </a>
    <nav class="desktop-nav">
      <button class="nav-item is-active" type="button" data-route="home" aria-current="page"><i class="fi fi-rr-home nav-icon" aria-hidden="true"></i><span>Início</span></button>
      <button class="nav-item" type="button" data-route="orders"><i class="fi fi-rr-receipt nav-icon" aria-hidden="true"></i><span>Pedidos</span></button>
      <button class="nav-item" type="button" data-route="profile"><i class="fi fi-rr-user nav-icon" aria-hidden="true"></i><span>Perfil</span></button>
    </nav>
  </aside>

  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__copy"><span>MANAUS · AM</span><strong id="page-title">Cardápio</strong></div>
      <button class="cart-pill" id="header-cart-btn" type="button" aria-label="Abrir carrinho"><i class="fi fi-rr-shopping-bag"></i><span id="header-cart-count">0</span></button>
    </header>

    <main id="app-content">
      <section class="route is-active" id="home-route" data-route-panel="home">
        <section class="hero-section">
          <div class="hero-carousel" data-carousel="hero">
            <div class="hero-track" data-carousel-track>
              <article class="hero-slide"><img src="assets/pratos.png" alt="Pratos principais Ignite"></article>
              <article class="hero-slide"><img src="assets/bebidas.png" alt="Bebidas Ignite"></article>
              <article class="hero-slide"><img src="assets/combos.png" alt="Combos Ignite"></article>
              <article class="hero-slide"><img src="assets/promoção.png" alt="Promoções Ignite"></article>
            </div>
          </div>
        </section>
        <section class="catalog-toolbar">
          <label class="search-box"><i class="fi fi-rr-search"></i><input id="product-search" type="search" placeholder="Buscar no cardápio" autocomplete="off"></label>
          <div class="category-list" id="category-list"></div>
        </section>
        <section class="products-carousel" data-carousel="products">
          <div class="section-heading"><div><span>ESCOLHA O SEU</span><h2>Cardápio</h2></div></div>
          <div class="product-grid" id="product-grid" data-carousel-track></div>
        </section>
      </section>

      <section class="route" id="orders-route" data-route-panel="orders"><div id="orders-content"></div></section>
      <section class="route" id="profile-route" data-route-panel="profile"><div id="profile-content"></div></section>
    </main>
  </div>

  <div id="connection-badge" class="connection-badge" hidden></div>
  <nav class="bottom-nav" aria-label="Navegação móvel">
    <button class="bottom-nav__item is-active" type="button" data-route="home"><i class="fi fi-rr-home"></i><span>Início</span></button>
    <button class="bottom-nav__action" id="bottom-cart-btn" type="button" aria-label="Abrir carrinho"><i class="fi fi-rr-plus"></i></button>
    <button class="bottom-nav__item" type="button" data-route="profile"><i class="fi fi-rr-user"></i><span>Perfil</span></button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
