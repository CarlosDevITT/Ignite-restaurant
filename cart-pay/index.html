  <!-- CSS antigo dos componentes (layout base). O visual/cores deles agora é
       sobrescrito pelo novo tema Ignite no <style> abaixo, que carrega depois
       e usa os mesmos seletores — não precisa editar esses arquivos. -->

  <link rel="stylesheet" href="../styles/components/header-styles.css" media="(min-width: 1024px)">
  <link rel="stylesheet" href="../styles/components/cart-unified.css">
  <link rel="stylesheet" href="../styles/components/chatbot.css">
  <link rel="stylesheet" href="../styles/components/payment-styles.css">
  <link rel="stylesheet" href="../styles/components/feed-styles.css">
  <link rel="stylesheet" href="../styles/components/responsive-enhancements.css">

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

  <!-- ========== CORE UTILS & PROTECTION ========== -->

  <!-- Enhanced styles -->
  <style>
    /* ══════════════════════════════════════════════════════════
       BLINDAGEM — não depende do Tailwind CDN carregar/rodar.
       Garante que o header mobile e o desktop nunca apareçam
       juntos, e que elementos com .hidden fiquem escondidos
       mesmo se o script do CDN falhar ou for bloqueado.
       ══════════════════════════════════════════════════════════ */
    .hidden { display: none !important; }

    .header-container { display: flex; }
    .header-desktop { display: none; }

    @media (min-width: 1024px) {
      .header-container { display: none !important; }
      .header-desktop { display: block !important; }
    }

    @media (max-width: 1023px) {
      .header-desktop { display: none !important; }
    }

    #chat-modal.hidden,
    #feed-modal.hidden,
    #profile-modal.hidden,
    #new-post-sheet.hidden,
    #comments-sheet.hidden,
    #cart-overlay.hidden,
    #search-bar-mobile.hidden,
    #categories-menu.hidden,
    #categories-menu-desktop.hidden,
    #chat-actions-menu.hidden {
      display: none !important;
    }

    #chat-modal:not(.hidden) { display: flex !important; }
    #feed-modal:not(.hidden) { display: flex !important; }
    #profile-modal:not(.hidden) { display: block !important; }
    #new-post-sheet:not(.hidden),
    #comments-sheet:not(.hidden) { display: block !important; }
    #cart-overlay:not(.hidden) { display: block !important; }
    #search-bar-mobile:not(.hidden) { display: flex !important; }

    #chat-modal, #feed-modal, #profile-modal, #new-post-sheet,
    #comments-sheet, #cart-overlay {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
    }

    /* ══════════════════════════════════════════════════════════
       IGNITE — DESIGN SYSTEM
       Conceito: brasa/forno de pub — verde-mata quase preto (a cor
       da chapa/backdrop da marca) + chama laranja como assinatura +
       âmbar de cerveja como acento secundário. Tipografia em caixa
       alta e peso 800/900 lembrando o crachá do logo.
       ══════════════════════════════════════════════════════════ */
    :root {
      /* Superfícies */
      --ig-bg: #07130d;
      --ig-bg-soft: #0c2016;
      --ig-surface: #0f2418;
      --ig-surface-2: #15301f;
      --ig-border: rgba(255, 154, 87, 0.16);
      --ig-border-soft: rgba(255, 255, 255, 0.07);

      /* Marca */
      --color-primary: #ff5a1f;
      --color-primary-dark: #d93f0e;
      --color-primary-light: #ffe8dc;
      --color-primary-glow: rgba(255, 90, 31, 0.28);
      --ig-ember: #ffb238;
      --ig-ember-soft: rgba(255, 178, 56, 0.16);

      /* Texto */
      --color-title: #f6efe2;
      --color-text: #b7c7bd;
      --color-text-light: #7c9186;
      --color-body: var(--ig-bg);
      --color-card: var(--ig-surface);

      --radius-card: 18px;
      --shadow-card: 0 2px 18px rgba(0, 0, 0, 0.35), 0 1px 4px rgba(0, 0, 0, 0.25);
      --shadow-card-hover: 0 16px 44px rgba(0, 0, 0, 0.45), 0 6px 16px var(--color-primary-glow);
      --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Base ───────────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background-color: var(--ig-bg);
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Poppins', sans-serif;
      background-color: var(--ig-bg);
      background-image:
        radial-gradient(760px 420px at 50% -8%, rgba(255, 106, 43, 0.16), transparent 65%),
        radial-gradient(900px 620px at 90% 0%, rgba(6, 92, 54, 0.35), transparent 60%);
      background-attachment: fixed;
      color: var(--color-title);
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--color-primary);
      color: #fff;
    }

    h1, h2, h3, h4 {
      font-family: 'Outfit', 'Poppins', sans-serif;
    }

    /* ── Section headings (estilo crachá) ───────────────────── */
    .section-heading {
      font-family: 'Outfit', sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      color: var(--color-title);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.25rem;
    }

    .section-heading .icon-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      color: #fff;
      font-size: 0.9rem;
      flex-shrink: 0;
      box-shadow: 0 4px 14px var(--color-primary-glow);
    }

    .section-heading::after {
      content: '';
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, var(--ig-border), transparent);
      border-radius: 2px;
    }

    /* ── Product cards ──────────────────────────────────────── */
    .product-name {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      line-height: 1.35;
      letter-spacing: -0.01em;
      color: var(--color-title);
      margin-bottom: 0.2rem;
    }

    .product-price {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: -0.02em;
      color: var(--ig-ember);
      background: none;
      -webkit-text-fill-color: var(--ig-ember);
    }

    .product-price.original {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 0.75rem;
      text-decoration: line-through;
      color: var(--color-text-light);
      -webkit-text-fill-color: var(--color-text-light);
      background: none;
      display: block;
      margin-top: 1px;
    }

    .product-category,
    .product-description {
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      color: var(--color-text);
      line-height: 1.5;
    }

    /* Card base */
    .product-item {
      background: linear-gradient(180deg, var(--ig-surface-2), var(--ig-surface));
      border-radius: var(--radius-card);
      padding: 0.875rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--ig-border-soft);
      transition: transform 0.3s var(--transition-smooth),
        box-shadow 0.3s var(--transition-smooth),
        border-color 0.3s var(--transition-smooth);
      cursor: pointer;
    }

    .product-item:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-card-hover);
      border-color: var(--ig-border);
    }

    /* Image inside card */
    .product-item .img-wrap {
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 4 / 3;
      background: linear-gradient(135deg, #0c2016, #15301f);
    }

    .product-item img {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      object-fit: cover;
      transition: transform 0.4s var(--transition-smooth);
      display: block;
    }

    /* Cards em carrossel horizontal (Novidades / Destaques) */
    #new-products .product-item {
      min-width: 180px;
      max-width: 180px;
    }

    .product-item:hover img {
      transform: scale(1.06);
    }

    .product-item .product-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-item .product-price {
      align-self: flex-start;
    }

    .product-item .add-to-cart-btn {
      margin-top: 0.875rem;
      align-self: stretch;
    }

    /* Add to cart button */
    .add-to-cart-btn {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      border-radius: 10px;
      transition: all 0.2s var(--transition-smooth);
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      color: #fff;
      border: none;
      padding: 9px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 10px var(--color-primary-glow);
    }

    .add-to-cart-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px var(--color-primary-glow);
    }

    .add-to-cart-btn:active {
      transform: scale(0.96);
    }

    /* ── Scrollbar global hide ──────────────────────────────── */
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* ── Main container ─────────────────────────────────────── */
    main {
      background: transparent;
    }

    /* ── Cart sidebar tweaks ────────────────────────────────── */
    #cart-sidebar {
      font-family: 'Plus Jakarta Sans', 'Poppins', sans-serif;
      background: #fbfaf7;
    }

    .cart-header-premium {
      background: linear-gradient(120deg, var(--ig-bg-soft), #0c1a12);
      border-bottom: 1px solid var(--ig-border);
    }

    .cart-header-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ig-ember);
    }

    .cart-header-name {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      color: #fff;
      letter-spacing: -0.01em;
    }

    .cart-close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .cart-close-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    /* Tipo de pedido / pagamento */
    .cart-type-section,
    .cart-payment-section {
      background: #fff;
      border: 1px solid #eee6dd;
    }

    .cart-type-header,
    .cart-payment-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #1a1a2e;
      background: #fbf5ee;
      border-bottom: 1px solid #eee6dd;
    }

    .cart-type-icon,
    .cart-payment-icon {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      color: #fff;
      font-size: 0.7rem;
    }

    .cart-type-options,
    .cart-payment-options {
      display: flex;
      flex-direction: column;
    }

    .cart-type-option,
    .cart-payment-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f3ede4;
      transition: background 0.2s ease;
      position: relative;
    }

    .cart-type-option:last-child,
    .cart-payment-option:last-child {
      border-bottom: none;
    }

    .cart-type-option:hover,
    .cart-payment-option:hover {
      background: #fbf5ee;
    }

    .cart-type-radio,
    .cart-payment-radio {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .cart-type-option-icon,
    .cart-payment-option-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f5efe6;
      color: #8a7458;
      font-size: 0.95rem;
    }

    .cart-type-option-info,
    .cart-payment-option-info {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .cart-type-option-title,
    .cart-payment-option-title {
      font-weight: 700;
      font-size: 0.88rem;
      color: #1a1a2e;
    }

    .cart-type-option-sub,
    .cart-payment-option-sub {
      font-size: 0.72rem;
      color: #8a8a99;
    }

    .cart-type-check,
    .cart-payment-check {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #e2d9cb;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      color: transparent;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .cart-type-radio:checked ~ .cart-type-check,
    .cart-payment-radio:checked ~ .cart-payment-check {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }

    .cart-type-radio:checked ~ .cart-type-option-icon,
    .cart-payment-radio:checked ~ .cart-payment-option-icon {
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      color: #fff;
    }

    .cart-type-option:has(.cart-type-radio:checked),
    .cart-payment-option:has(.cart-payment-radio:checked) {
      background: var(--color-primary-light);
    }

    .cart-change-row {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      background: #fbf5ee;
      border-top: 1px solid #f3ede4;
    }

    .cart-change-icon {
      color: var(--ig-ember);
      margin-top: 3px;
    }

    .cart-change-question {
      font-weight: 700;
      font-size: 0.82rem;
      color: #1a1a2e;
      margin: 0 0 8px;
    }

    .cart-change-btns {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .cart-change-toggle {
      padding: 6px 16px;
      border-radius: 999px;
      border: 2px solid #e2d9cb;
      background: #fff;
      font-weight: 700;
      font-size: 0.75rem;
      color: #8a7458;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cart-change-toggle.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }

    .cart-change-amount-row {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 2px solid #e2d9cb;
      border-radius: 12px;
      padding: 8px 12px;
    }

    .cart-change-prefix {
      font-weight: 700;
      color: #8a7458;
    }

    .cart-change-input {
      border: none;
      outline: none;
      flex: 1;
      font-weight: 700;
      font-size: 0.9rem;
      color: #1a1a2e;
    }

    .cart-totals-box {
      background: #fff;
      border: 1px solid #eee6dd;
      border-radius: 16px;
      padding: 18px;
    }

    .cart-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.86rem;
      color: #5f5f6e;
      padding: 6px 0;
    }

    .cart-total-divider {
      height: 1px;
      background: #f0e9df;
      margin: 8px 0;
    }

    .cart-total-row.total-final {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      color: #1a1a2e;
      padding-top: 4px;
    }

    .cart-total-row.total-final span:last-child {
      color: var(--color-primary);
    }

    .cart-checkout-footer {
      padding: 14px 16px;
      background: #fff;
      border-top: 1px solid #eee6dd;
    }

    .cart-checkout-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 15px;
      border-radius: 14px;
      border: none;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
      background: #d9d2c4;
      color: #8a8378;
    }

    .cart-checkout-btn.disabled {
      cursor: not-allowed;
    }

    /* ── Stories slider ─────────────────────────────────────── */
    #stories-slider {
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    /* ── Nav bottom animation ───────────────────────────────── */
    nav button {
      transition: color 0.2s ease, transform 0.15s ease;
    }

    nav button:active {
      transform: scale(0.9);
    }

    /* ── Profile modal inputs ───────────────────────────────── */
    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--color-primary) !important;
      box-shadow: 0 0 0 3px var(--color-primary-glow);
    }

    /* ── Promo badge on cards ───────────────────────────────── */
    .promo-card-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: linear-gradient(135deg, var(--ig-ember), #e08c1a);
      color: #1a12
